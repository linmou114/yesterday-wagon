<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#0A1018"/>

  <text x="64" y="54" font-family="Microsoft YaHei" font-size="13" fill="#2DD4BF">04 · 应用现状</text>
  <text x="64" y="96" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#E8EEF6">同类产品做到了哪一步</text>
  <rect x="64" y="112" width="832" height="1" fill="#22303F"/>

  <!-- 表头 -->
  <g font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">
    <text x="88" y="146">类型 / 代表</text>
    <text x="316" y="146">强项</text>
    <text x="536" y="146">短板</text>
    <text x="716" y="146">与本项目的关系</text>
  </g>

  <!-- 三行 -->
  <g>
    <rect x="64" y="158" width="832" height="76" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="88" y="188" font-family="Microsoft YaHei" font-size="15" font-weight="700" fill="#E8EEF6">单机策略战棋</text>
    <text x="88" y="212" font-family="Microsoft YaHei" font-size="12" fill="#7F90A6">火焰纹章、高级战争</text>
    <text x="316" y="188" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">规则深、关卡厚、</text>
    <text x="316" y="210" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">兵种与地形互相咬合</text>
    <text x="536" y="188" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">体量大、周期长，</text>
    <text x="536" y="210" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">不做实时联机</text>
    <text x="716" y="188" font-family="Microsoft YaHei" font-size="13" fill="#93A4B8">借它的战斗模型，</text>
    <text x="716" y="210" font-family="Microsoft YaHei" font-size="13" fill="#93A4B8">缩到 15 分钟一局</text>

    <rect x="64" y="246" width="832" height="76" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="88" y="276" font-family="Microsoft YaHei" font-size="15" font-weight="700" fill="#E8EEF6">网页回合制对战</text>
    <text x="88" y="300" font-family="Microsoft YaHei" font-size="12" fill="#7F90A6">在线棋类、卡牌对战</text>
    <text x="316" y="276" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">开房间即玩，</text>
    <text x="316" y="298" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">联机与断线重连成熟</text>
    <text x="536" y="276" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">玩法多为既成规则，</text>
    <text x="536" y="298" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">玩家只能换牌组</text>
    <text x="716" y="276" font-family="Microsoft YaHei" font-size="13" fill="#93A4B8">借它的房间模型，</text>
    <text x="716" y="298" font-family="Microsoft YaHei" font-size="13" fill="#93A4B8">但规则要能自己长</text>

    <rect x="64" y="334" width="832" height="76" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="88" y="364" font-family="Microsoft YaHei" font-size="15" font-weight="700" fill="#E8EEF6">创作型平台</text>
    <text x="88" y="388" font-family="Microsoft YaHei" font-size="12" fill="#7F90A6">工坊、关卡编辑器</text>
    <text x="316" y="364" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">UGC 生态强，</text>
    <text x="316" y="386" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">创作者能持续产出</text>
    <text x="536" y="364" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">规则常靠脚本引擎承载，</text>
    <text x="536" y="386" font-family="Microsoft YaHei" font-size="13" fill="#C7D3E1">数值与平衡难管</text>
    <text x="716" y="364" font-family="Microsoft YaHei" font-size="13" fill="#93A4B8">借它的思路，</text>
    <text x="716" y="386" font-family="Microsoft YaHei" font-size="13" fill="#93A4B8">但用「白名单字段」约束</text>
  </g>

  <!-- 定位 -->
  <rect x="64" y="428" width="832" height="52" rx="10" fill="#0E1A26" stroke="#2DD4BF" stroke-opacity="0.35"/>
  <text x="88" y="450" font-family="Microsoft YaHei" font-size="13" fill="#93A4B8">定位空档：</text>
  <text x="156" y="450" font-family="Microsoft YaHei" font-size="14" fill="#E8EEF6">小体量（一局十几分钟）＋ 玩家可自建兵种 ＋ 真联机</text>
  <text x="88" y="470" font-family="Microsoft YaHei" font-size="12" fill="#7F90A6">三者同时具备的少，因为前两条各自都会把后两条的成本推高。</text>

  <text x="896" y="502" font-family="Consolas" font-size="12" fill="#33445A" text-anchor="end">04</text>
</svg>
