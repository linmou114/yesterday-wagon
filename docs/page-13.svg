<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#0A1018"/>
  <circle cx="836" cy="470" r="140" fill="#2DD4BF" fill-opacity="0.05"/>

  <text x="64" y="54" font-family="Microsoft YaHei" font-size="13" fill="#2DD4BF">13 · 总结与展望</text>
  <text x="64" y="96" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#E8EEF6">做成了什么，还差什么</text>
  <rect x="64" y="112" width="832" height="1" fill="#22303F"/>

  <!-- 左：三条结论 -->
  <text x="64" y="142" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">三条结论</text>
  <g>
    <rect x="64" y="154" width="404" height="90" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="88" y="182" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#2DD4BF">规则只有一份，所以「一致」是结构保证</text>
    <text x="88" y="206" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">客户端、AI、服务端 require 同一个 engine.js；</text>
    <text x="88" y="226" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">联机争议从「谁算对了」变成「服务端说了算」。</text>

    <rect x="64" y="254" width="404" height="90" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="88" y="282" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#F43F5E">兵种是数据，所以加内容不改代码</text>
    <text x="88" y="306" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">从 3 个兵种加到 7 个、再加玩家自建的兵种，</text>
    <text x="88" y="326" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">规则层只改了一张表；渲染与面板自动跟上。</text>

    <rect x="64" y="354" width="404" height="90" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="88" y="382" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#FBBF24">把「不确定」交给测试，而不是交给手感</text>
    <text x="88" y="406" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">819 项断言 + 两组 AI 对抗数据，改数值或改规则</text>
    <text x="88" y="426" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">之后能立刻知道「是不是变差了」。</text>
  </g>

  <!-- 右：展望 -->
  <text x="492" y="142" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">还差什么 / 下一步</text>
  <g>
    <rect x="492" y="154" width="404" height="74" rx="12" fill="#0E1A26" stroke="#22303F"/>
    <text x="512" y="180" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#E8EEF6">数值平衡还没有系统方法</text>
    <text x="512" y="202" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">自对弈里坦克几乎没人买（6 局 0 次）——这是数据</text>
    <text x="512" y="220" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">说出来的问题，下一步要用胜率回归来调价。</text>

    <rect x="492" y="238" width="404" height="74" rx="12" fill="#0E1A26" stroke="#22303F"/>
    <text x="512" y="264" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#E8EEF6">AI 只有一层前瞻</text>
    <text x="512" y="286" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">下一步引入带剪枝的两层搜索 + 置换表，</text>
    <text x="512" y="304" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">或把评估函数换成一个小的价值网络。</text>

    <rect x="492" y="322" width="404" height="74" rx="12" fill="#0E1A26" stroke="#22303F"/>
    <text x="512" y="348" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#E8EEF6">UGC 还缺审核与分享</text>
    <text x="512" y="370" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">现在只做了上传、配额与删除凭据；</text>
    <text x="512" y="388" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">下一步加举报、评分与「一局只用同一套 mod」。</text>

    <rect x="492" y="406" width="404" height="86" rx="12" fill="#0E1A26" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="512" y="432" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#2DD4BF">备案完成后切 80 端口 + 域名访问</text>
    <text x="512" y="454" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">当前只能用 IP:3000 访问；域名已解析，等 ICP 下来</text>
    <text x="512" y="474" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">即可换成 https://yesterday-wagon.xyz。</text>
  </g>

  <text x="64" y="486" font-family="Microsoft YaHei" font-size="16" font-weight="700" fill="#E8EEF6">谢谢，欢迎提问</text>
  <text x="896" y="502" font-family="Consolas" font-size="12" fill="#33445A" text-anchor="end">13</text>
</svg>
