<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#0A1018"/>

  <text x="64" y="54" font-family="Microsoft YaHei" font-size="13" fill="#2DD4BF">08 · 技术方案｜核心模块</text>
  <text x="64" y="96" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#E8EEF6">AI：估值看吃子，搜索往下压到七层</text>
  <rect x="64" y="112" width="832" height="1" fill="#22303F"/>

  <!-- 左：五项评估 -->
  <text x="64" y="142" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">评估函数由五项组成（权重经自对弈调试）</text>
  <g font-family="Microsoft YaHei" font-size="12.5">
    <text x="64" y="172" fill="#C7D3E1">棋子价值</text>
    <text x="176" y="172" font-size="11.5" fill="#7F90A6">按攻击力 / 血量 / 射程合成，光环按边际贡献折算</text>
    <rect x="64" y="182" width="360" height="6" rx="3" fill="#1B2735"/><rect x="64" y="182" width="300" height="6" rx="3" fill="#2DD4BF"/>

    <text x="64" y="212" fill="#C7D3E1">中央加成</text>
    <text x="176" y="212" font-size="11.5" fill="#7F90A6">越靠中央越贵，射程越长加成越大（炮兵 +28%）</text>
    <rect x="64" y="222" width="360" height="6" rx="3" fill="#1B2735"/><rect x="64" y="222" width="252" height="6" rx="3" fill="#2DD4BF"/>

    <text x="64" y="252" fill="#C7D3E1">吃子估值</text>
    <text x="176" y="252" font-size="11.5" fill="#7F90A6">先算伤害表，本回合会死的子按已死计分</text>
    <rect x="64" y="262" width="360" height="6" rx="3" fill="#1B2735"/><rect x="64" y="262" width="356" height="6" rx="3" fill="#F43F5E"/>

    <text x="64" y="292" fill="#C7D3E1">推进施压</text>
    <text x="176" y="292" font-size="11.5" fill="#7F90A6">离对方大本营越近越好，能一击打爆直接判胜</text>
    <rect x="64" y="302" width="360" height="6" rx="3" fill="#1B2735"/><rect x="64" y="302" width="214" height="6" rx="3" fill="#2DD4BF"/>

    <text x="64" y="332" fill="#C7D3E1">火力覆盖</text>
    <text x="176" y="332" font-size="11.5" fill="#7F90A6">打击格覆盖到的对方棋子与基地</text>
    <rect x="64" y="342" width="360" height="6" rx="3" fill="#1B2735"/><rect x="64" y="342" width="146" height="6" rx="3" fill="#2DD4BF"/>
  </g>

  <!-- 左下：为什么砍掉残血折价 -->
  <rect x="64" y="372" width="360" height="102" rx="12" fill="#0E1A26" stroke="#2DD4BF" stroke-opacity="0.35"/>
  <text x="84" y="398" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#2DD4BF">为什么砍掉「残血折价」</text>
  <text x="84" y="422" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">结算只有「死」和「不死」两种结果：resolve 里</text>
  <text x="84" y="442" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">只有 dmg ≥ hp 的判定，从不扣血。血量既然不</text>
  <text x="84" y="462" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">会掉，残血折价就没有对象，权重让给吃子和位置。</text>

  <!-- 右上：搜索方式 -->
  <text x="452" y="142" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">决策方式：迭代加深 + α-β 剪枝</text>
  <rect x="452" y="154" width="444" height="150" rx="12" fill="#121A26" stroke="#22303F"/>
  <text x="472" y="182" font-family="Microsoft YaHei" font-size="12.5" fill="#C7D3E1">回合拆成原子动作：放子 / 召唤 / 结算 / 结束</text>
  <text x="472" y="206" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">先按启发式排序（能秒人的落点排前面），再剪枝</text>
  <text x="472" y="234" font-family="Microsoft YaHei" font-size="12.5" fill="#C7D3E1">每个候选：克隆局面 → 执行 → 估分</text>
  <text x="472" y="258" font-family="Consolas" font-size="11.5" fill="#93A4B8">clone() → apply() → evaluate()　取最高分</text>
  <text x="472" y="284" font-family="Microsoft YaHei" font-size="11.5" fill="#7F90A6">迭代加深 4~7 层；1.2 秒约 1.8 万节点，超时用上一层结果</text>

  <!-- 右下：数据 -->
  <text x="452" y="330" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">效果（固定随机种子）</text>
  <g>
    <rect x="452" y="342" width="444" height="128" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="472" y="368" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">对随机走子（20 局）</text>
    <rect x="608" y="356" width="152" height="16" rx="4" fill="#1B2735"/>
    <rect x="608" y="356" width="152" height="16" rx="4" fill="#2DD4BF"/>
    <text x="772" y="369" font-family="Consolas" font-size="12" font-weight="700" fill="#2DD4BF">20 : 0</text>

    <text x="472" y="404" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">对上一版 AI（20 局）</text>
    <rect x="608" y="392" width="152" height="16" rx="4" fill="#1B2735"/>
    <rect x="608" y="392" width="152" height="16" rx="4" fill="#2DD4BF"/>
    <text x="772" y="405" font-family="Consolas" font-size="12" font-weight="700" fill="#2DD4BF">20 : 0</text>

    <text x="472" y="440" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">单步思考</text>
    <text x="608" y="441" font-family="Consolas" font-size="13" font-weight="700" fill="#FBBF24">1~3 s</text>
    <text x="668" y="441" font-family="Microsoft YaHei" font-size="11.5" fill="#7F90A6">（原来 10 ms 只看一步）</text>
    <text x="472" y="462" font-family="Microsoft YaHei" font-size="11" fill="#6B7C91">自对弈 12 局：新版 9 局分出胜负、平均 52 回合（旧版 3 局 / 97 回合）</text>
  </g>

  <text x="896" y="502" font-family="Consolas" font-size="12" fill="#33445A" text-anchor="end">08</text>
</svg>
