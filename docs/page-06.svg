<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#0A1018"/>

  <text x="64" y="54" font-family="Microsoft YaHei" font-size="13" fill="#2DD4BF">06 · 技术方案｜整体架构</text>
  <text x="64" y="96" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#E8EEF6">四层结构，规则只有一份</text>
  <rect x="64" y="112" width="832" height="1" fill="#22303F"/>

  <!-- 层 -->
  <g>
    <rect x="64" y="132" width="600" height="58" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="84" y="158" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#93A4B8">表现层</text>
    <text x="84" y="178" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">画布渲染 · 面板 · 输入</text>
    <text x="212" y="166" font-family="Consolas" font-size="12.5" fill="#C7D3E1">renderer.js　main.js　tutorial.js</text>

    <rect x="64" y="200" width="600" height="58" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="84" y="226" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#93A4B8">应用层</text>
    <text x="84" y="246" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">对局控制 · 联机 · 设置</text>
    <text x="212" y="234" font-family="Consolas" font-size="12.5" fill="#C7D3E1">main.js　net.js　settings.js　mods.js</text>

    <rect x="64" y="268" width="600" height="58" rx="10" fill="#0E1A26" stroke="#2DD4BF"/>
    <text x="84" y="294" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#2DD4BF">规则层</text>
    <text x="84" y="314" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">唯一真相来源</text>
    <text x="212" y="302" font-family="Consolas" font-size="12.5" fill="#E8EEF6">engine.js　（浏览器 &amp; Node 同一文件）</text>

    <rect x="64" y="336" width="600" height="58" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="84" y="362" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#93A4B8">传输层</text>
    <text x="84" y="382" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">协议 · 存储</text>
    <text x="212" y="370" font-family="Consolas" font-size="12.5" fill="#C7D3E1">WebSocket /ws　REST /api/mods　静态文件</text>
  </g>

  <!-- 左侧箭头 -->
  <g stroke="#3D5568" stroke-width="1.4" marker-end="url(#ar)">
    <line x1="44" y1="132" x2="44" y2="394"/>
  </g>
  <text x="36" y="272" font-family="Microsoft YaHei" font-size="11" fill="#6B7C91" transform="rotate(-90 36 272)" text-anchor="middle">调用方向</text>

  <!-- 右侧：一份代码三处使用 -->
  <rect x="700" y="132" width="196" height="262" rx="12" fill="#0E1A26" stroke="#2DD4BF" stroke-opacity="0.35"/>
  <text x="720" y="160" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#2DD4BF">同一份 engine.js</text>
  <g font-family="Microsoft YaHei" font-size="12" fill="#C7D3E1">
    <text x="720" y="192">① 浏览器单机 / AI</text>
    <text x="732" y="212" font-size="11" fill="#7F90A6">直接 new Game()</text>
    <text x="720" y="244">② AI 自对弈脚本</text>
    <text x="732" y="264" font-size="11" fill="#7F90A6">node 里跑同一套规则</text>
    <text x="720" y="296">③ 服务端校验</text>
    <text x="732" y="316" font-size="11" fill="#7F90A6">require 同一个文件</text>
  </g>
  <rect x="720" y="336" width="156" height="1" fill="#22303F"/>
  <text x="720" y="358" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">所以联机不存在</text>
  <text x="720" y="376" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">「两套规则不一致」</text>

  <!-- 底部三个好处 -->
  <g>
    <rect x="64" y="414" width="264" height="56" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="84" y="438" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#E8EEF6">可测</text>
    <text x="84" y="458" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">规则层不碰 DOM，命令行跑断言</text>

    <rect x="348" y="414" width="264" height="56" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="368" y="438" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#E8EEF6">同构</text>
    <text x="368" y="458" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">UMD 双模式，浏览器与 Node 通用</text>

    <rect x="632" y="414" width="264" height="56" rx="10" fill="#121A26" stroke="#22303F"/>
    <text x="652" y="438" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#E8EEF6">可扩展</text>
    <text x="652" y="458" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">兵种是数据，不是分支代码</text>
  </g>

  <text x="896" y="502" font-family="Consolas" font-size="12" fill="#33445A" text-anchor="end">06</text>
</svg>
