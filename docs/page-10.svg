<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#0A1018"/>

  <text x="64" y="54" font-family="Microsoft YaHei" font-size="13" fill="#2DD4BF">10 · 效果展示</text>
  <text x="64" y="96" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#E8EEF6">两个页面，从入座到开打</text>
  <rect x="64" y="112" width="832" height="1" fill="#22303F"/>

  <!-- 左：菜单 -->
  <g>
    <text x="64" y="142" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">入口页 index.html</text>
    <rect x="64" y="152" width="404" height="253" rx="8" fill="#121A26" stroke="#22303F"/>
    <image x="66" y="154" width="400" height="250" href="./shot-menu-page.png"/>

    <text x="64" y="428" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#E8EEF6">四种模式一屏选完</text>
    <text x="64" y="450" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">本地双人 / 人机 / 联机开房 / 新手教学，右侧是「继续对局」与</text>
    <text x="64" y="468" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">在线房间数；设置与规则都在这一页，不来回跳。</text>
  </g>

  <!-- 右：对局 -->
  <g>
    <text x="492" y="142" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">对局页 game.html</text>
    <rect x="492" y="152" width="404" height="253" rx="8" fill="#121A26" stroke="#22303F"/>
    <image x="494" y="154" width="400" height="250" href="./shot-game-page.png"/>

    <text x="492" y="428" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#E8EEF6">一屏装下决策需要的全部信息</text>
    <text x="492" y="450" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">左：双方兵力与战报；中：棋盘与落点提示；右：选中棋子的详细</text>
    <text x="492" y="468" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">数值；底：六张兵种卡与「结算 / 结束回合」。</text>
  </g>

  <text x="896" y="502" font-family="Consolas" font-size="12" fill="#33445A" text-anchor="end">10</text>
</svg>
