<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect x="0" y="0" width="960" height="540" fill="#0A1018"/>

  <text x="64" y="54" font-family="Microsoft YaHei" font-size="13" fill="#2DD4BF">05 · 技术现状</text>
  <text x="64" y="96" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#E8EEF6">四条技术线，我们各自站在哪</text>
  <rect x="64" y="112" width="832" height="1" fill="#22303F"/>

  <!-- 2x2 -->
  <g>
    <rect x="64" y="134" width="404" height="150" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="88" y="166" font-family="Microsoft YaHei" font-size="12" fill="#2DD4BF">六边形网格</text>
    <text x="88" y="196" font-family="Microsoft YaHei" font-size="16" font-weight="700" fill="#E8EEF6">轴向坐标 + 立方坐标约束</text>
    <text x="88" y="224" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">主流做法是 Red Blob 的 axial / cube 体系：</text>
    <text x="88" y="246" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">距离、邻居、像素映射都有闭式公式。</text>
    <text x="88" y="270" font-family="Consolas" font-size="11.5" fill="#7F90A6">d = (|dq| + |dr| + |dq+dr|) / 2</text>

    <rect x="492" y="134" width="404" height="150" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="516" y="166" font-family="Microsoft YaHei" font-size="12" fill="#F43F5E">棋类 AI</text>
    <text x="516" y="196" font-family="Microsoft YaHei" font-size="16" font-weight="700" fill="#E8EEF6">从 Minimax 到 MCTS 到 AlphaZero</text>
    <text x="516" y="224" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">AlphaZero 已证明「自对弈 + 价值网络」可行，</text>
    <text x="516" y="246" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">但训练成本与本项目规模不匹配。</text>
    <text x="516" y="270" font-family="Microsoft YaHei" font-size="12" fill="#7F90A6">我们的选择：手写评估函数 + 迭代加深 α-β</text>

    <rect x="64" y="300" width="404" height="150" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="88" y="332" font-family="Microsoft YaHei" font-size="12" fill="#FBBF24">实时通信</text>
    <text x="88" y="362" font-family="Microsoft YaHei" font-size="16" font-weight="700" fill="#E8EEF6">WebSocket 是网页双向通信的标准答案</text>
    <text x="88" y="390" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">HTTP 轮询延迟高、开销大；SSE 只能单向下发。</text>
    <text x="88" y="412" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">对局是「双方随时可能动作」，长连接更合适。</text>
    <text x="88" y="436" font-family="Microsoft YaHei" font-size="12" fill="#7F90A6">我们的选择：ws 库 + 心跳 + 座位令牌重连</text>

    <rect x="492" y="300" width="404" height="150" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="516" y="332" font-family="Microsoft YaHei" font-size="12" fill="#A78BFA">内容扩展</text>
    <text x="516" y="362" font-family="Microsoft YaHei" font-size="16" font-weight="700" fill="#E8EEF6">开放内容通常走「数据驱动 + 白名单」</text>
    <text x="516" y="390" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">让玩家提交数据而非代码：字段固定、数值夹紧，</text>
    <text x="516" y="412" font-family="Microsoft YaHei" font-size="12.5" fill="#93A4B8">服务端二次校验，避免自定义内容变成攻击面。</text>
    <text x="516" y="436" font-family="Microsoft YaHei" font-size="12" fill="#7F90A6">我们的选择：REST 上传 + 对局只传编号</text>
  </g>

  <text x="896" y="502" font-family="Consolas" font-size="12" fill="#33445A" text-anchor="end">05</text>
</svg>
