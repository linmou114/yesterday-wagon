<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#0A1018"/>

  <text x="64" y="54" font-family="Microsoft YaHei" font-size="13" fill="#2DD4BF">09 · 技术方案｜核心模块</text>
  <text x="64" y="96" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#E8EEF6">联机与自建兵种：都不信任客户端</text>
  <rect x="64" y="112" width="832" height="1" fill="#22303F"/>

  <!-- 联机 -->
  <text x="64" y="142" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">① 联机：服务端权威</text>
  <g font-family="Microsoft YaHei" font-size="11.5">
    <rect x="64" y="154" width="150" height="58" rx="9" fill="#121A26" stroke="#22303F"/>
    <text x="139" y="178" font-size="12.5" font-weight="700" fill="#E8EEF6" text-anchor="middle">建房 / 加入</text>
    <text x="139" y="198" fill="#7F90A6" text-anchor="middle">4 位房号 + 座位令牌</text>

    <line x1="218" y1="183" x2="242" y2="183" stroke="#3D5568" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="246" y="154" width="150" height="58" rx="9" fill="#121A26" stroke="#22303F"/>
    <text x="321" y="178" font-size="12.5" font-weight="700" fill="#E8EEF6" text-anchor="middle">只发「意图」</text>
    <text x="321" y="198" fill="#7F90A6" text-anchor="middle">place / resolve / end</text>

    <line x1="400" y1="183" x2="424" y2="183" stroke="#3D5568" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="428" y="154" width="150" height="58" rx="9" fill="#0E1A26" stroke="#2DD4BF" stroke-opacity="0.6"/>
    <text x="503" y="178" font-size="12.5" font-weight="700" fill="#2DD4BF" text-anchor="middle">服务端算一遍</text>
    <text x="503" y="198" fill="#7F90A6" text-anchor="middle">同一个 engine.js</text>

    <line x1="582" y1="183" x2="606" y2="183" stroke="#3D5568" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="610" y="154" width="140" height="58" rx="9" fill="#121A26" stroke="#22303F"/>
    <text x="680" y="178" font-size="12.5" font-weight="700" fill="#E8EEF6" text-anchor="middle">广播全量状态</text>
    <text x="680" y="198" fill="#7F90A6" text-anchor="middle">含双方费用与手牌</text>

    <line x1="754" y1="183" x2="778" y2="183" stroke="#3D5568" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="782" y="154" width="114" height="58" rx="9" fill="#121A26" stroke="#22303F"/>
    <text x="839" y="178" font-size="12.5" font-weight="700" fill="#E8EEF6" text-anchor="middle">客户端重绘</text>
    <text x="839" y="198" fill="#7F90A6" text-anchor="middle">不做增量猜测</text>
  </g>
  <text x="64" y="232" font-family="Microsoft YaHei" font-size="11.5" fill="#6B7C91">为什么发全量而不是增量？一局状态只有几 KB，重连、观战、悔棋都变成「换一个快照」；代价是带宽，可接受。</text>

  <!-- MOD -->
  <text x="64" y="268" font-family="Microsoft YaHei" font-size="12" fill="#6B7C91">② 自建兵种：只传编号，定义由服务端提供</text>
  <g font-family="Microsoft YaHei" font-size="11.5">
    <rect x="64" y="280" width="150" height="58" rx="9" fill="#121A26" stroke="#22303F"/>
    <text x="139" y="304" font-size="12.5" font-weight="700" fill="#E8EEF6" text-anchor="middle">工坊编辑</text>
    <text x="139" y="324" fill="#7F90A6" text-anchor="middle">血量 / 攻击 / 光环</text>

    <line x1="218" y1="309" x2="242" y2="309" stroke="#3D5568" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="246" y="280" width="150" height="58" rx="9" fill="#121A26" stroke="#22303F"/>
    <text x="321" y="304" font-size="12.5" font-weight="700" fill="#E8EEF6" text-anchor="middle">POST /api/mods</text>
    <text x="321" y="324" fill="#7F90A6" text-anchor="middle">8 KB 上限 + 配额</text>

    <line x1="400" y1="309" x2="424" y2="309" stroke="#3D5568" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="428" y="280" width="150" height="58" rx="9" fill="#0E1A26" stroke="#2DD4BF" stroke-opacity="0.6"/>
    <text x="503" y="304" font-size="12.5" font-weight="700" fill="#2DD4BF" text-anchor="middle">白名单字段 + 夹值</text>
    <text x="503" y="324" fill="#7F90A6" text-anchor="middle">hp 1–30 · cost 0–30</text>

    <line x1="582" y1="309" x2="606" y2="309" stroke="#3D5568" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="610" y="280" width="140" height="58" rx="9" fill="#121A26" stroke="#22303F"/>
    <text x="680" y="304" font-size="12.5" font-weight="700" fill="#E8EEF6" text-anchor="middle">对局只带 modIds</text>
    <text x="680" y="324" fill="#7F90A6" text-anchor="middle">形如 mod_cb4385…</text>

    <line x1="754" y1="309" x2="778" y2="309" stroke="#3D5568" stroke-width="1.4" marker-end="url(#a2)"/>

    <rect x="782" y="280" width="114" height="58" rx="9" fill="#121A26" stroke="#22303F"/>
    <text x="839" y="304" font-size="12.5" font-weight="700" fill="#E8EEF6" text-anchor="middle">服务端取定义</text>
    <text x="839" y="324" fill="#7F90A6" text-anchor="middle">注入本局 types</text>
  </g>

  <!-- 三条约束 -->
  <g>
    <rect x="64" y="360" width="264" height="106" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="84" y="386" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#FBBF24">自定义 ≠ 可执行代码</text>
    <text x="84" y="410" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">玩家提交的是一组数值，不是脚本；</text>
    <text x="84" y="430" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">服务端重新校验并夹紧，越界就截断。</text>
    <text x="84" y="452" font-family="Microsoft YaHei" font-size="11.5" fill="#7F90A6">→ 不被上传内容拖进注入面</text>

    <rect x="348" y="360" width="264" height="106" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="368" y="386" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#FBBF24">双方必须用同一份定义</text>
    <text x="368" y="410" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">若由客户端各自上传，房主改一次数值</text>
    <text x="368" y="430" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">就能让对手看到不同的兵——所以按 id 取。</text>
    <text x="368" y="452" font-family="Microsoft YaHei" font-size="11.5" fill="#7F90A6">→ 同 id 同定义，两个客户端才谈得上一致</text>

    <rect x="632" y="360" width="264" height="106" rx="12" fill="#121A26" stroke="#22303F"/>
    <text x="652" y="386" font-family="Microsoft YaHei" font-size="13" font-weight="700" fill="#FBBF24">额度与删除凭据</text>
    <text x="652" y="410" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">每个客户端免密最多 4 个自定义棋子；</text>
    <text x="652" y="430" font-family="Microsoft YaHei" font-size="11.5" fill="#93A4B8">删除需要上传时返回的 secret。</text>
    <text x="652" y="452" font-family="Microsoft YaHei" font-size="11.5" fill="#7F90A6">→ 防止把公共库当图床</text>
  </g>

  <text x="896" y="502" font-family="Consolas" font-size="12" fill="#33445A" text-anchor="end">09</text>
</svg>
